<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>One clock</title><style>html,body{margin:0;background:#10252f}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../lib/harness.js"></script><script src="../lib/sound.js"></script>
<script>
// A composed vertical short, not a centre crop of the landscape example.
const ctx=document.getElementById('c').getContext('2d');window.DURATION=12;window.FPS=30;
const P=H.prog,E=H.ease,C={bg:'#10252f',ink:'#f4f0e5',mint:'#a9e4ba',mute:'#b5c4c8'};
function text(s,x,y,px=64,col=C.ink,align='left'){ctx.fillStyle=col;ctx.font=`700 ${px}px Arial,sans-serif`;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillText(s,x,y);}
function rect(x,y,w,h,col,r=18){ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
window.__renderFrame=t=>{
 ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;rect(0,0,1080,1920,C.bg,0);
 text('VIDEO / BY CODE',90,180,30,C.mute);text('ONE CLOCK.',90,340,116);text('EVERY FRAME.',90,475,94,C.mint);
 const x=540,y=820,r=215;ctx.strokeStyle=C.mint;ctx.lineWidth=12;ctx.beginPath();ctx.arc(x,y,r,-Math.PI/2,-Math.PI/2+Math.PI*2*E.outCubic(P(t,.2,1.7)));ctx.stroke();
 for(let i=0;i<12;i++){let a=i/12*Math.PI*2;ctx.strokeStyle=C.mute;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x+Math.cos(a)*185,y+Math.sin(a)*185);ctx.lineTo(x+Math.cos(a)*198,y+Math.sin(a)*198);ctx.stroke();}
 const a=t/4*Math.PI*2-Math.PI/2;ctx.strokeStyle=C.ink;ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(a)*160,y+Math.sin(a)*160);ctx.stroke();rect(x-9,y-9,18,18,C.mint,9);
 text(`t = ${t.toFixed(2)} s`,540,1145,64,C.ink,'center');
 const labels=['PICTURE','SOUND','CAPTIONS'];
 labels.forEach((s,i)=>{const k=E.outCubic(P(t,2.2+i*.6,2.65+i*.6));rect(90,1220+i*105,900*k,80,i===1?C.mint:'#213e48');if(k>.9)text(s,130,1273+i*105,35,i===1?C.bg:C.ink);});
 if(t>=6){const k=P(t,6,6.4);ctx.globalAlpha=k;rect(60,1525,960,155,C.ink);text('Same time in.',540,1590,49,C.bg,'center');text('Same picture out.',540,1650,49,C.bg,'center');ctx.globalAlpha=1;}
 rect(90,1745,900*P(t,0,12),7,C.mint,0);
};
window.__ready=document.fonts.ready;
window.scoreSound=k=>{k.play('pop',.2,{gain:.3});for(let i=0;i<3;i++)k.play('tock',2.2+i*.6,{gain:.2});k.play('success',6,{gain:.25});};
</script><script src="../lib/player.js"></script></body></html>
